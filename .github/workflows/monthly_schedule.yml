name: Auto Monthly Manga Schedule

on:
  schedule:
    # Chạy vào 13:00 UTC (tức 20:00 tối giờ Việt Nam) vào các ngày 1, 3, 5, 26, 29 hàng tháng
    - cron: '0 13 1,3,5,26,29 * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" bằng tay ngay trên giao diện GitHub để test

jobs:
  crawl-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài đặt Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 3. Cài đặt Tesseract OCR (tiếng Việt) và thư viện Python
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 4. Nạp cấu hình .env từ GitHub Secrets
        run: |
          cat << 'EOF' > .env
          ${{ secrets.DOTENV_CONTENT }}
          EOF

      - name: 5. Chạy Bot Săn Lịch và Lưu lên Google Drive
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
        run: python cloud_run.py

      - name: 6. Lưu trữ ảnh & ảnh chụp màn hình debug làm Artifacts trên GitHub (7 ngày)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lich-phat-hanh-downloads
          path: |
            fb_downloads/*
          retention-days: 7